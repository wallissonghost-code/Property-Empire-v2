name: Build Roblox museum game

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build with Rojo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rojo
        run: cargo install rojo --version 7.6.1 --locked
      - name: Build place
        run: rojo build default.project.json --output Museum-Empire.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: Museum-Empire
          path: Museum-Empire.rbxlx
          if-no-files-found: error

name: Publish Mining Empire to Roblox

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_place_id:
        description: "Type the target Place ID to confirm publication"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_place_id == '138523274489009') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEPLOY_ROBLOX]')) }}
    runs-on: ubuntu-latest
    env:
      UNIVERSE_ID: "10715548183"
      PLACE_ID: "138523274489009"
      ROBLOX_API_KEY: ${{ secrets.Property_empire }}

    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify current build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          test -f scripts/current-place.rbxmk.lua
          test -f scripts/prepare-place.sh

      - name: Make universe public and capture Roblox configuration
        shell: bash
        run: |
          set -u
          mkdir -p .deploy

          PATCH_HTTP=$(curl -sS -o /tmp/patch-universe.json -w "%{http_code}" \
            -X PATCH \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"PUBLIC"}' \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}?updateMask=visibility" || true)

          sleep 2

          GAME_HTTP=$(curl -sS -o /tmp/game.json -w "%{http_code}" \
            "https://games.roblox.com/v1/games?universeIds=${UNIVERSE_ID}" || true)

          PLACES_HTTP=$(curl -sS -o /tmp/places.json -w "%{http_code}" \
            "https://develop.roblox.com/v1/universes/${UNIVERSE_ID}/places?limit=100&sortOrder=Asc" || true)

          CLOUD_UNIVERSE_HTTP=$(curl -sS -o /tmp/cloud-universe.json -w "%{http_code}" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}" || true)

          CLOUD_PLACE_HTTP=$(curl -sS -o /tmp/cloud-place.json -w "%{http_code}" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}/places/${PLACE_ID}" || true)

          ROOT_PLACE=$(jq -r '.data[0].rootPlaceId // "unknown"' /tmp/game.json 2>/dev/null || echo unknown)
          MAX_PLAYERS=$(jq -r '.data[0].maxPlayers // "unknown"' /tmp/game.json 2>/dev/null || echo unknown)
          GAME_NAME=$(jq -r '.data[0].name // "unknown"' /tmp/game.json 2>/dev/null || echo unknown)
          PLAYING=$(jq -r '.data[0].playing // "unknown"' /tmp/game.json 2>/dev/null || echo unknown)
          VISIBILITY=$(jq -r '.visibility // "unknown"' /tmp/cloud-universe.json 2>/dev/null || echo unknown)
          PLACE_LIST=$(jq -c '[.data[]? | {id,name}]' /tmp/places.json 2>/dev/null || echo '[]')

          cat > .deploy/roblox-diagnostics.txt <<EOF
          checked_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          universe_id=${UNIVERSE_ID}
          configured_place_id=${PLACE_ID}
          patch_visibility_http=${PATCH_HTTP}
          visibility=${VISIBILITY}
          public_game_http=${GAME_HTTP}
          public_places_http=${PLACES_HTTP}
          cloud_universe_http=${CLOUD_UNIVERSE_HTTP}
          cloud_place_http=${CLOUD_PLACE_HTTP}
          root_place_id=${ROOT_PLACE}
          max_players=${MAX_PLAYERS}
          game_name=${GAME_NAME}
          playing=${PLAYING}
          places=${PLACE_LIST}
          patch_visibility_response=$(tr '\n' ' ' < /tmp/patch-universe.json 2>/dev/null | head -c 1000)
          cloud_universe_response=$(tr '\n' ' ' < /tmp/cloud-universe.json 2>/dev/null | head -c 1200)
          cloud_place_response=$(tr '\n' ' ' < /tmp/cloud-place.json 2>/dev/null | head -c 1000)
          EOF

          cat .deploy/roblox-diagnostics.txt
          if [ "$VISIBILITY" != "PUBLIC" ]; then
            echo "Universe visibility is still $VISIBILITY; publication will continue, but the experience may remain inaccessible."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install rbxmk
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/anaminus/rbxmk/rbxmk@v0.9.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/rbxmk" version

      - name: Prepare brand-new Mining Empire place
        shell: bash
        run: |
          chmod +x scripts/prepare-place.sh
          ./scripts/prepare-place.sh
          test -s Mining-Empire.rbxl

      - name: Publish Mining Empire to Roblox
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o publish-response.txt -w "%{http_code}" \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @Mining-Empire.rbxl \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published")
          echo "publish_http=$HTTP_CODE"
          cat publish-response.txt || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Roblox publish failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Restart Roblox universe servers
        shell: bash
        run: |
          set -u
          HTTP_CODE=$(curl -sS -o restart-response.txt -w "%{http_code}" \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}:restartServers" || true)
          echo "restart_http=$HTTP_CODE"
          cat restart-response.txt || true

      - name: Record successful publish
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/last-publish.txt <<EOF
          project=Mining Empire
          place_id=${PLACE_ID}
          universe_id=${UNIVERSE_ID}
          source_commit=${GITHUB_SHA}
          build=current-from-scratch
          artifact=Mining-Empire.rbxl
          transformer=rbxmk-v0.9.1
          published_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status=accepted_by_roblox_open_cloud
          EOF

      - name: Commit publish and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/last-publish.txt .deploy/roblox-diagnostics.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record Roblox publish and diagnostics"
          git push

name: Publish Museum Game to Roblox

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_place_id:
        description: "Type the target Place ID to confirm publication"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish Museum Game
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_place_id == '138523274489009') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEPLOY_ROBLOX]')) }}
    runs-on: ubuntu-latest
    env:
      UNIVERSE_ID: "10715548183"
      PLACE_ID: "138523274489009"
      ROBLOX_API_KEY: ${{ secrets.Property_empire }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify API key
        shell: bash
        run: 'test -n "$ROBLOX_API_KEY"'
      - name: Install Rojo
        run: cargo install rojo --version 7.6.1 --locked
      - name: Build place
        run: rojo build default.project.json --output Museum-Empire.rbxlx
      - name: Publish through Roblox Open Cloud
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @Museum-Empire.rbxlx
      - name: Record publication
        shell: bash
        run: |
          mkdir -p .deploy
          {
            echo "place_id=${PLACE_ID}"
            echo "universe_id=${UNIVERSE_ID}"
            echo "source_commit=${GITHUB_SHA}"
            echo "published_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "status=accepted_by_roblox_open_cloud"
          } > .deploy/last-publish.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/last-publish.txt
          git commit -m "chore: record successful museum publish" || exit 0
          git push

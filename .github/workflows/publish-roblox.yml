name: Publish Mining Empire to Roblox

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_place_id:
        description: "Type the target Place ID to confirm publication"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_place_id == '138523274489009') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[DEPLOY_ROBLOX]')) }}
    runs-on: ubuntu-latest
    env:
      UNIVERSE_ID: "10715548183"
      PLACE_ID: "138523274489009"
      ROBLOX_API_KEY: ${{ secrets.Property_empire }}

    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify current build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          test -f scripts/current-place.rbxmk.lua
          test -f scripts/prepare-place.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install rbxmk
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/anaminus/rbxmk/rbxmk@v0.9.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/rbxmk" version

      - name: Prepare brand-new Mining Empire place
        shell: bash
        run: |
          chmod +x scripts/prepare-place.sh
          ./scripts/prepare-place.sh
          test -s Mining-Empire.rbxl

      - name: Publish Mining Empire to Roblox
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o publish-response.txt -w "%{http_code}" \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @Mining-Empire.rbxl \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published")
          echo "publish_http=$HTTP_CODE"
          cat publish-response.txt || true
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Roblox publish failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Restart Roblox universe servers
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o restart-response.txt -w "%{http_code}" \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}:restartServers")
          echo "restart_http=$HTTP_CODE"
          cat restart-response.txt || true

      - name: Record successful publish
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/last-publish.txt <<EOF
          project=Mining Empire
          place_id=${PLACE_ID}
          universe_id=${UNIVERSE_ID}
          source_commit=${GITHUB_SHA}
          build=current-from-scratch
          artifact=Mining-Empire.rbxl
          transformer=rbxmk-v0.9.1
          published_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status=accepted_by_roblox_open_cloud
          EOF

      - name: Commit publish record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/last-publish.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record successful Mining Empire publish"
          git push

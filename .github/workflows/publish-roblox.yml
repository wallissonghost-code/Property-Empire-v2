name: Publish CIDADE PROSPERA to Roblox

on:
  push:
    branches: [main]
    paths:
      - "default.project.json"
      - "src/**"
      - ".github/workflows/publish-roblox.yml"
  workflow_dispatch:

concurrency:
  group: cidade-prospera-place-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  ROBLOX_UNIVERSE_ID: "10765616545"
  ROBLOX_PLACE_ID: "80220344568601"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify recovery project
        run: |
          set -euo pipefail
          test -f default.project.json
          grep -q '"DataModel"' default.project.json
          grep -q '"SpawnLocation"' default.project.json

      - name: Install Rojo 7.6.1
        run: |
          set -euo pipefail
          ZIP=/tmp/rojo.zip
          DIR=/tmp/rojo
          curl --fail --silent --show-error --location "https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip" --output "$ZIP"
          echo "a9542a713036897fdbd0173e7a105ea409658333133c949025fcb6f1a7ca909d  $ZIP" | sha256sum --check -
          mkdir -p "$DIR"
          unzip -q "$ZIP" -d "$DIR"
          sudo install -m 0755 "$DIR/rojo" /usr/local/bin/rojo
          rojo --version

      - name: Build minimal playable place
        run: |
          set -euo pipefail
          mkdir -p build
          rojo build default.project.json -o build/game.rbxl
          test -s build/game.rbxl
          ls -lh build/game.rbxl

      - name: Publish CIDADE PROSPERA
        env:
          ROBLOX_API_KEY: ${{ secrets.MUSEU_EMPIRE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          URL="https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=Published"
          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT
          for ATTEMPT in 1 2 3 4; do
            HTTP_CODE=$(curl --silent --show-error --location --output "$RESPONSE" --write-out "%{http_code}" --request POST "$URL" --header "x-api-key: ${ROBLOX_API_KEY}" --header "Content-Type: application/octet-stream" --data-binary @build/game.rbxl)
            BODY=$(cat "$RESPONSE")
            echo "Roblox publish attempt ${ATTEMPT}: HTTP ${HTTP_CODE}"
            echo "Roblox response: ${BODY}"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then exit 0; fi
            if [ "$HTTP_CODE" != "409" ] || [ "$ATTEMPT" -eq 4 ]; then exit 1; fi
            sleep 180
          done

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: cidade-prospera-recovery-place
          path: build/game.rbxl
          if-no-files-found: error
          retention-days: 7
